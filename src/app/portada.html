<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datágora | Laboratorio de inteligencia artificial</title>
<style>
html,body{margin:0}
body{background:#F3F3EA;color:#122F2C;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:flex-end;min-height:100vh;min-height:100dvh}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:var(--grain,none);background-size:var(--grain-size,auto);background-position:0 0;background-repeat:repeat}
main{position:relative;z-index:1;box-sizing:border-box;width:100%;padding:2rem clamp(1.25rem,5vw,4rem) clamp(1.5rem,6vh,4rem)}
h1{margin:0;font-size:clamp(1.6rem,3.4vw,2.6rem);font-weight:650;letter-spacing:-.025em;line-height:1.1}
p{margin:.35em 0 0;font-size:clamp(.95rem,1.4vw,1.15rem);line-height:1.35;opacity:.78}
a{display:inline-flex;align-items:center;min-height:44px;margin-top:.7rem;color:#34534d;font-size:.9rem;font-weight:500;text-decoration:underline #C9DD5C .22em;text-underline-offset:.12em}
a:hover{color:#122F2C}
a:focus-visible{outline:2px solid #0d6158;outline-offset:4px;border-radius:2px}
</style>
</head>
<body>
<main>
<h1>Datágora</h1>
<p>Laboratorio de inteligencia artificial</p>
<a href="/trabajo">Ver el trabajo</a>
</main>
<script>
(function () {
  // Paper grain: one static, non-repeating noise texture per load, at device pixel scale.
  var MAX_SIDE = 3072;   // device-pixel cap per side
  var MAX_ALPHA = 7;     // 7/255 ≈ 2.7 %, never above 3 %
  try {
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var cssSide = Math.max(screen.width || 0, screen.height || 0, innerWidth, innerHeight);
    var side = Math.min(Math.ceil(cssSide * dpr), MAX_SIDE);
    var canvas = document.createElement("canvas");
    canvas.width = canvas.height = side;
    var ctx = canvas.getContext("2d");
    if (!ctx || !canvas.toBlob) return;

    var img = ctx.createImageData(side, side);
    var d = img.data;
    var seed = (Date.now() ^ (Math.random() * 0x7fffffff)) >>> 0 || 1;
    for (var i = 0; i < d.length; i += 4) {
      seed ^= seed << 13; seed >>>= 0;
      seed ^= seed >>> 17;
      seed ^= seed << 5; seed >>>= 0;
      var r = seed / 4294967296;
      d[i] = 0x12; d[i + 1] = 0x2F; d[i + 2] = 0x2C;
      // Skewed distribution: most grains faint, a few slightly darker -> irregular, not a flat haze.
      d[i + 3] = Math.min(MAX_ALPHA, Math.floor(r * r * (MAX_ALPHA + 1)));
    }
    ctx.putImageData(img, 0, 0);

    canvas.toBlob(function (blob) {
      if (!blob) return;
      var root = document.documentElement.style;
      var size = (side / dpr) + "px";
      root.setProperty("--grain-size", size + " " + size);
      root.setProperty("--grain", "url(" + URL.createObjectURL(blob) + ")");
    }, "image/png");
  } catch (e) {
    // Plain background stays as fallback.
  }
})();
</script>
</body>
</html>
